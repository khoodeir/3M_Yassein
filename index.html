<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BELLA KOKO | الحسابات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FDB913;--k:#000;--bg:#f6f4ee;--w:#fff;--mut:#6b6b6b;--ok:#1f8a4c;--bad:#c62828;--line:#e3dfd3}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--k);min-height:100vh}
button,input,select{font:inherit}
.hide{display:none!important}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:52px;height:52px;border-radius:50%}
.logo b{font-weight:800;font-size:1.1rem;letter-spacing:.04em;line-height:1.1}
.logo small{display:block;font-weight:600;font-size:.7rem;color:var(--mut);letter-spacing:.3em}
#login{min-height:100vh;display:grid;place-items:center;background:var(--k);padding:20px}
#login form{background:var(--y);padding:32px 28px;border-radius:50% 50% 24px 24px/30% 30% 24px 24px;width:min(360px,100%);text-align:center;display:grid;gap:14px;justify-items:center}
#login input{width:100%;padding:12px;border:2px solid var(--k);border-radius:10px;text-align:center;font-size:1.2rem;background:var(--w)}
.btn{background:var(--k);color:var(--y);border:0;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.btn:hover{background:#222}.btn.alt{background:var(--y);color:var(--k)}.btn.sm{padding:5px 12px;font-size:.85rem}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
:focus-visible{outline:3px solid var(--k);outline-offset:2px}
header{background:var(--k);color:var(--w);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--y)}
header .logo small{color:var(--y)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;color:var(--w);border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
nav button.on{background:var(--y);color:var(--k);font-weight:800}
main{max-width:1000px;margin:0 auto;padding:20px}
h2{font-size:1.25rem;font-weight:800;margin:0 0 12px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.bar input,.bar select,.form input,.form select{padding:9px 10px;border:1.5px solid var(--k);border-radius:8px;background:var(--w)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--w);border:2px solid var(--k);border-radius:14px;padding:14px 16px}
.stat.hero{background:var(--y);grid-column:1/-1;padding:20px}
.stat span{font-size:.9rem;color:var(--mut)}.stat.hero span{color:var(--k)}
.stat b{display:block;font-size:1.7rem;font-weight:800}.stat.hero b{font-size:2.6rem}
.form{background:var(--w);border:2px solid var(--k);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.form .full{grid-column:1/-1}
.tbl{background:var(--w);border:2px solid var(--k);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:var(--k);color:var(--y);text-align:right;padding:10px;font-weight:600}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.rem{color:var(--bad);font-weight:800}.done{color:var(--ok);font-weight:800}
.pill{padding:4px 12px;border-radius:99px;border:2px solid var(--k);background:var(--w);font-weight:800;cursor:pointer}
.pill.on{background:var(--ok);border-color:var(--ok);color:var(--w)}
td input.q{width:64px;padding:5px;border:1.5px solid var(--k);border-radius:6px}
.empty{padding:26px;text-align:center;color:var(--mut)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--k);color:var(--y);padding:10px 20px;border-radius:10px;font-weight:600}

.stat.pos b{color:var(--ok)}.stat.neg b{color:var(--bad)}
.panel{background:var(--w);border:2px solid var(--k);border-radius:14px;padding:16px;margin-bottom:22px}
.chart{display:flex;gap:12px;height:170px}.col{flex:1;display:flex;flex-direction:column;gap:6px;text-align:center}
.bars{flex:1;display:flex;gap:4px;align-items:flex-end}
.bars i,.bars u{flex:1;display:block;min-height:2px;border-radius:4px 4px 0 0}
.bars i{background:var(--y);border:1.5px solid var(--k)}.bars u{background:var(--k)}
.lg{margin-top:10px;font-size:.85rem;display:flex;gap:8px;align-items:center}
.lg i,.lg u{display:inline-block;width:14px;height:14px;border-radius:3px}.lg i{background:var(--y);border:1.5px solid var(--k)}.lg u{background:var(--k);margin-right:10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:start center;overflow:auto;padding:20px;z-index:9}
#mbox{background:var(--bg);border:3px solid var(--y);border-radius:16px;padding:18px;width:min(720px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h2{margin:0}
.x{background:var(--k);color:var(--y);border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:800}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}label.full{grid-column:1/-1}
label input,label select{font-weight:400}
.b input,.bar input{min-width:0}
@media(max-width:600px){main{padding:12px}.stat.hero b{font-size:2rem}}
</style>
</head>

<script>
const SB_URL = "https://nxdskesytzuatasgdsoa.supabase.co/rest/v1/";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54ZHNrZXN5dHp1YXRhc2dkc29hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NTM3OTIsImV4cCI6MjEwMjQyOTc5Mn0.ZmaXVsTe7JxY1r8sfQZR0g0zdUwFn-Ov44uryDRN3VY";
const DEFAULT_PASS = "2026";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n || 0).toLocaleString("ar-EG", {maximumFractionDigits: 2}) + " ج.م";
const sum = a => a.reduce((x, y) => x + y, 0);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => iso(new Date());
const fdate = s => s ? new Date(s).toLocaleDateString("ar-EG", {day: "numeric", month: "short", year: "numeric"}) : "—";
const dOf = s => iso(new Date(s));
const PER = {month: "شهري", week: "أسبوعي", day: "يومي"};
const curKey = p => {
  const d = new Date();
  if (p === "month") return iso(d).slice(0, 7);
  if (p === "day") return iso(d);
  d.setDate(d.getDate() - ((d.getDay() + 1) % 7)); // بداية الأسبوع السبت
  return iso(d);
};
const keyLabel = (k, p) => k.startsWith("x") ? "دفعة يدوية" : p === "month" ? k : p === "week" ? "أسبوع " + fdate(k) : fdate(k);

let S = {clients: [], payments: [], workers: [], records: [], month: iso(new Date()).slice(0, 7), tab: "dash"};

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hide"), 2500); }
function modal(h) { $("#mbox").innerHTML = h; $("#modal").classList.remove("hide"); }
function closeM() { $("#modal").classList.add("hide"); }
$("#modal").onclick = e => { if (e.target.id === "modal") closeM(); };

async function api(table, method = "GET", query = "", body) {
  const r = await fetch(SB_URL + table + query, {
    method,
    headers: {apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json", Prefer: "return=representation"},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) { toast("تعذر الاتصال بقاعدة البيانات"); throw new Error(await r.text()); }
  return r.status === 204 ? null : r.json();
}
async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("bellakoko:" + s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function storedHash() {
  const r = await api("settings", "GET", "?key=eq.pass_hash&select=value");
  return r.length ? r[0].value : await sha(DEFAULT_PASS);
}

// ===== الدخول والحماية =====
let fails = 0, lockUntil = 0;
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  if (Date.now() < lockUntil) { $("#lerr").textContent = "استنى " + Math.ceil((lockUntil - Date.now()) / 1000) + " ثانية"; return; }
  try {
    if (await sha($("#pw").value) === await storedHash()) { $("#pw").value = ""; start(); }
    else {
      fails++; $("#pw").value = "";
      if (fails >= 5) { lockUntil = Date.now() + 60000; fails = 0; $("#lerr").textContent = "تم القفل لمدة دقيقة"; }
      else $("#lerr").textContent = "كلمة السر غلط";
    }
  } catch { $("#lerr").textContent = "تعذر الاتصال"; }
};
const logout = () => location.reload();
$("#out").onclick = logout;
let idle; const bump = () => { clearTimeout(idle); idle = setTimeout(logout, 15 * 60 * 1000); };
["click", "keydown", "touchstart"].forEach(ev => addEventListener(ev, bump));

$("#nav").onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  S.tab = t; document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t)); render();
};

async function start() {
  $("#login").classList.add("hide"); $("#app").classList.remove("hide"); bump();
  $("#view").innerHTML = `<div class="empty">جاري التحميل...</div>`;
  await load(); render();
}
async function load() {
  const [c, p, w, r] = await Promise.all([
    api("clients", "GET", "?select=*&order=created_at.desc"),
    api("payments", "GET", "?select=*&order=paid_at.desc"),
    api("workers", "GET", "?select=*&order=created_at.asc"),
    api("salary_records", "GET", "?select=*&paid=eq.true&order=paid_at.desc")
  ]);
  Object.assign(S, {clients: c, payments: p, workers: w, records: r});
}
const paidOf = id => sum(S.payments.filter(p => p.client_id === id).map(p => +p.amount));
const incOf = k => sum(S.payments.filter(p => p.paid_at.slice(0, 7) === k).map(p => +p.amount));
const salOf = k => sum(S.records.filter(r => dOf(r.paid_at).slice(0, 7) === k).map(r => +r.amount));
const monthPick = () => `<input type="month" value="${S.month}" onchange="S.month=this.value;render()" aria-label="الشهر">`;
const refresh = async () => { await load(); render(); };

function render() {
  const v = $("#view");
  v.innerHTML = {dash, clients: clientsView, workers: workersView, settings: settingsView}[S.tab]();
}

// ===== الداش بورد =====
function chart() {
  const ms = []; let [y, m] = S.month.split("-").map(Number);
  for (let i = 0; i < 6; i++) { ms.unshift(y + "-" + String(m).padStart(2, "0")); m--; if (!m) { m = 12; y--; } }
  const data = ms.map(k => ({k, i: incOf(k), s: salOf(k)}));
  const mx = Math.max(1, ...data.flatMap(d => [d.i, d.s]));
  return `<div class="chart">${data.map(d => `<div class="col"><div class="bars"><i style="height:${d.i / mx * 100}%" title="${money(d.i)}"></i><u style="height:${d.s / mx * 100}%" title="${money(d.s)}"></u></div><small>${d.k.slice(5)}/${d.k.slice(2, 4)}</small></div>`).join("")}</div>
  <div class="lg"><i></i> دخل <u></u> مرتبات</div>`;
}
function dash() {
  const inc = incOf(S.month), paidSal = salOf(S.month);
  const dueNow = sum(S.workers.filter(w => !S.records.some(r => r.worker_id === w.id && r.month === curKey(w.period))).map(w => +w.salary));
  const owed = sum(S.clients.map(c => Math.max(0, +c.total_cost - paidOf(c.id))));
  const profit = inc - paidSal;
  const last = S.payments.filter(p => p.paid_at.slice(0, 7) === S.month).slice(0, 8);
  return `<div class="bar"><h2 style="margin:0">الداش بورد</h2>${monthPick()}</div>
  <div class="stats">
    <div class="stat hero"><span>دخل الشهر</span><b>${money(inc)}</b></div>
    <div class="stat"><span>مرتبات مصروفة</span><b>${money(paidSal)}</b></div>
    <div class="stat ${profit < 0 ? "neg" : "pos"}"><span>صافي الربح</span><b>${money(profit)}</b></div>
    <div class="stat"><span>مرتبات لسه</span><b>${money(dueNow)}</b></div>
    <div class="stat"><span>باقي عند العملاء</span><b>${money(owed)}</b></div>
    <div class="stat"><span>العملاء</span><b>${S.clients.length}</b></div>
  </div>
  <h2>آخر 6 شهور</h2><div class="panel">${chart()}</div>
  <h2>دفعات الشهر</h2>
  <div class="tbl">${last.length ? `<table><tr><th>التاريخ</th><th>العميل</th><th>المبلغ</th></tr>${last.map(p => {
    const c = S.clients.find(x => x.id === p.client_id);
    return `<tr><td>${fdate(p.paid_at)}</td><td>${esc(c ? c.name : "-")}</td><td class="done">${money(p.amount)}</td></tr>`;
  }).join("")}</table>` : `<div class="empty">لا توجد دفعات</div>`}</div>`;
}

// ===== العملاء =====
function clientsView() {
  return `<h2>عميل جديد</h2>
  <div class="form">
    <input id="cn" placeholder="اسم العميل">
    <input id="cp" placeholder="التليفون" inputmode="tel">
    <input id="cc" type="number" min="0" placeholder="التكلفة">
    <input id="cd" type="number" min="0" placeholder="المدفوع">
    <input id="cw" class="full" placeholder="وصف الشغل">
    <button class="btn full" onclick="addClient()">حفظ</button>
  </div>
  <div class="bar"><h2 style="margin:0">العملاء</h2><input placeholder="بحث" oninput="filt(this.value)" style="flex:1;min-width:140px"></div>
  <div class="tbl">${S.clients.length ? `<table><tr><th>العميل</th><th>وصف الشغل</th><th>التكلفة</th><th>المدفوع</th><th>الباقي</th><th></th></tr>
  ${S.clients.map(c => {
    const p = paidOf(c.id), r = +c.total_cost - p;
    return `<tr data-s="${esc((c.name + " " + c.phone + " " + c.work_desc).toLowerCase())}"><td><b>${esc(c.name)}</b><br><small>${esc(c.phone)}</small></td><td>${esc(c.work_desc)}</td>
    <td>${money(c.total_cost)}</td><td class="done">${money(p)}</td>
    <td class="${r > 0 ? "rem" : "done"}">${r > 0 ? money(r) : "خالص"}</td>
    <td><button class="btn sm alt" onclick="openClient('${c.id}')">فتح</button></td></tr>`;
  }).join("")}</table>` : `<div class="empty">لا يوجد عملاء</div>`}</div>`;
}
function filt(q) { q = q.trim().toLowerCase(); document.querySelectorAll("tr[data-s]").forEach(r => r.classList.toggle("hide", !r.dataset.s.includes(q))); }
async function addClient() {
  const name = $("#cn").value.trim(); if (!name) return toast("اكتب اسم العميل");
  const [c] = await api("clients", "POST", "", {name, phone: $("#cp").value.trim(), work_desc: $("#cw").value.trim(), total_cost: +$("#cc").value || 0});
  const d = +$("#cd").value;
  if (d > 0) await api("payments", "POST", "", {client_id: c.id, amount: d});
  await refresh(); toast("تم الحفظ");
}
function openClient(id) {
  const c = S.clients.find(x => x.id === id), ps = S.payments.filter(p => p.client_id === id);
  const paid = sum(ps.map(p => +p.amount)), rem = +c.total_cost - paid;
  modal(`<div class="mh"><h2>${esc(c.name)}</h2><button class="x" onclick="closeM()" aria-label="إغلاق">✕</button></div>
  <div class="form">
    <label>الاسم<input id="en" value="${esc(c.name)}"></label>
    <label>التليفون<input id="ep" value="${esc(c.phone)}"></label>
    <label>التكلفة<input id="ec" type="number" min="0" value="${c.total_cost}"></label>
    <label class="full">وصف الشغل<input id="ew" value="${esc(c.work_desc)}"></label>
    <button class="btn full" onclick="saveClient('${id}')">حفظ التعديل</button>
  </div>
  <div class="stats"><div class="stat"><span>المدفوع</span><b class="done">${money(paid)}</b></div><div class="stat"><span>الباقي</span><b class="${rem > 0 ? "rem" : "done"}">${money(Math.max(0, rem))}</b></div></div>
  <div class="bar"><input id="np" type="number" min="0" placeholder="مبلغ الدفعة"><input id="nd" type="date" value="${today()}"><button class="btn alt" onclick="payClient('${id}')">تسجيل دفعة</button></div>
  <div class="tbl">${ps.length ? `<table><tr><th>التاريخ</th><th>المبلغ</th><th></th></tr>${ps.map(p => `<tr><td>${fdate(p.paid_at)}</td><td class="done">${money(p.amount)}</td><td><button class="btn sm del" onclick="delPay('${p.id}','${id}')">حذف</button></td></tr>`).join("")}</table>` : `<div class="empty">لا توجد دفعات</div>`}</div>
  <button class="btn del" style="margin-top:14px" onclick="delClient('${id}')">حذف العميل</button>`);
}
async function saveClient(id) {
  await api("clients", "PATCH", "?id=eq." + id, {name: $("#en").value.trim(), phone: $("#ep").value.trim(), work_desc: $("#ew").value.trim(), total_cost: +$("#ec").value || 0});
  await refresh(); openClient(id); toast("تم الحفظ");
}
async function payClient(id) {
  const a = +$("#np").value; if (!(a > 0)) return toast("اكتب المبلغ");
  await api("payments", "POST", "", {client_id: id, amount: a, paid_at: $("#nd").value || today()});
  await refresh(); openClient(id); toast("تم تسجيل الدفعة");
}
async function delPay(pid, cid) {
  if (!confirm("حذف الدفعة؟")) return;
  await api("payments", "DELETE", "?id=eq." + pid); await refresh(); openClient(cid);
}
async function delClient(id) {
  if (!confirm("حذف العميل وكل دفعاته؟")) return;
  await api("clients", "DELETE", "?id=eq." + id); closeM(); await refresh();
}

// ===== العمال =====
function lastPaid(wid) { const r = S.records.find(x => x.worker_id === wid); return r ? r.paid_at : null; }
function workersView() {
  const due = sum(S.workers.filter(w => !S.records.some(r => r.worker_id === w.id && r.month === curKey(w.period))).map(w => +w.salary));
  return `<h2>عامل جديد</h2>
  <div class="form">
    <input id="wn" placeholder="اسم العامل">
    <input id="ws" type="number" min="0" placeholder="المرتب">
    <select id="wp"><option value="month">شهري</option><option value="week">أسبوعي</option><option value="day">يومي</option></select>
    <button class="btn" onclick="addWorker()">حفظ</button>
  </div>
  <div class="stats"><div class="stat"><span>لسه ما استلموش</span><b class="rem">${money(due)}</b></div></div>
  <div class="tbl">${S.workers.length ? `<table><tr><th>العامل</th><th>المرتب</th><th>الحالة</th><th>آخر استلام</th><th></th></tr>
  ${S.workers.map(w => {
    const got = S.records.some(r => r.worker_id === w.id && r.month === curKey(w.period));
    return `<tr><td><b>${esc(w.name)}</b></td><td>${money(w.salary)} <small>${PER[w.period]}</small></td>
    <td><button class="pill ${got ? "on" : ""}" onclick="togglePaid('${w.id}')">${got ? "استلم" : "لسه"}</button></td>
    <td>${fdate(lastPaid(w.id))}</td>
    <td><button class="btn sm alt" onclick="openWorker('${w.id}')">السجل</button></td></tr>`;
  }).join("")}</table>` : `<div class="empty">لا يوجد عمال</div>`}</div>`;
}
async function addWorker() {
  const name = $("#wn").value.trim(); if (!name) return toast("اكتب اسم العامل");
  await api("workers", "POST", "", {name, salary: +$("#ws").value || 0, period: $("#wp").value});
  await refresh(); toast("تم الحفظ");
}
async function togglePaid(id) {
  const w = S.workers.find(x => x.id === id), k = curKey(w.period);
  const r = S.records.find(x => x.worker_id === id && x.month === k);
  if (r) { if (!confirm("إلغاء الاستلام؟")) return; await api("salary_records", "DELETE", "?id=eq." + r.id); }
  else {
    await api("salary_records", "DELETE", `?worker_id=eq.${id}&month=eq.${k}`);
    await api("salary_records", "POST", "", {worker_id: id, month: k, qty: 1, amount: w.salary, paid: true, paid_at: new Date().toISOString()});
  }
  await refresh();
}
function openWorker(id) {
  const w = S.workers.find(x => x.id === id), rs = S.records.filter(r => r.worker_id === id);
  modal(`<div class="mh"><h2>${esc(w.name)}</h2><button class="x" onclick="closeM()" aria-label="إغلاق">✕</button></div>
  <div class="form">
    <label>الاسم<input id="wen" value="${esc(w.name)}"></label>
    <label>المرتب<input id="wes" type="number" min="0" value="${w.salary}"></label>
    <label>النوع<select id="wep">${Object.entries(PER).map(([k, v]) => `<option value="${k}" ${k === w.period ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    <button class="btn" onclick="saveWorker('${id}')">حفظ التعديل</button>
  </div>
  <div class="stats"><div class="stat"><span>إجمالي المستلم</span><b>${money(sum(rs.map(r => +r.amount)))}</b></div><div class="stat"><span>مرات الاستلام</span><b>${rs.length}</b></div></div>
  <div class="bar"><input id="mx" type="number" min="0" placeholder="مبلغ"><input id="md" type="date" value="${today()}"><button class="btn alt" onclick="manualPay('${id}')">صرف مبلغ</button></div>
  <div class="tbl">${rs.length ? `<table><tr><th>الفترة</th><th>المبلغ</th><th>تاريخ الاستلام</th><th></th></tr>${rs.map(r => `<tr><td>${keyLabel(r.month, w.period)}</td><td>${money(r.amount)}</td><td>${fdate(r.paid_at)}</td><td><button class="btn sm del" onclick="delRec('${r.id}','${id}')">حذف</button></td></tr>`).join("")}</table>` : `<div class="empty">لا يوجد سجل</div>`}</div>
  <button class="btn del" style="margin-top:14px" onclick="delWorker('${id}')">حذف العامل</button>`);
}
async function saveWorker(id) {
  await api("workers", "PATCH", "?id=eq." + id, {name: $("#wen").value.trim(), salary: +$("#wes").value || 0, period: $("#wep").value});
  await refresh(); openWorker(id); toast("تم الحفظ");
}
async function manualPay(id) {
  const a = +$("#mx").value; if (!(a > 0)) return toast("اكتب المبلغ");
  await api("salary_records", "POST", "", {worker_id: id, month: "x" + Date.now(), qty: 1, amount: a, paid: true, paid_at: ($("#md").value || today()) + "T12:00:00"});
  await refresh(); openWorker(id); toast("تم الصرف");
}
async function delRec(rid, wid) {
  if (!confirm("حذف السجل؟")) return;
  await api("salary_records", "DELETE", "?id=eq." + rid); await refresh(); openWorker(wid);
}
async function delWorker(id) {
  if (!confirm("حذف العامل وسجله؟")) return;
  await api("workers", "DELETE", "?id=eq." + id); closeM(); await refresh();
}

// ===== الإعدادات =====
function settingsView() {
  return `<h2>كلمة السر</h2>
  <div class="form" style="max-width:420px;grid-template-columns:1fr">
    <input id="p0" type="password" placeholder="الحالية" autocomplete="off">
    <input id="p1" type="password" placeholder="الجديدة" autocomplete="off">
    <input id="p2" type="password" placeholder="تأكيد الجديدة" autocomplete="off">
    <button class="btn" onclick="changePass()">حفظ</button>
  </div>`;
}
async function changePass() {
  const [a, b, c] = ["#p0", "#p1", "#p2"].map(s => $(s).value);
  if (await sha(a) !== await storedHash()) return toast("كلمة السر الحالية غلط");
  if (b.length < 4) return toast("كلمة السر قصيرة");
  if (b !== c) return toast("غير متطابقتين");
  const h = await sha(b), ex = await api("settings", "GET", "?key=eq.pass_hash&select=key");
  if (ex.length) await api("settings", "PATCH", "?key=eq.pass_hash", {value: h});
  else await api("settings", "POST", "", {key: "pass_hash", value: h});
  ["#p0", "#p1", "#p2"].forEach(s => $(s).value = ""); toast("تم تغيير كلمة السر");
}

</script>
</body>
</html>
